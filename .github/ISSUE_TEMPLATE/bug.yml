name: Bug report
description: Something behaves wrongly or breaks
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: linkwarden-mcp version
      placeholder: '0.1.1 (npm version, docker tag or commit)'
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Linkwarden version
      description: >-
        Shown at the bottom of Linkwarden's settings page. This server was written
        against v2.16.0.
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: 'Claude Code, Claude Desktop, Codex, MCP Inspector, …'
  - type: dropdown
    id: meilisearch
    attributes:
      label: Does your Linkwarden run Meilisearch?
      description: >-
        Without it, Linkwarden matches a search query as one literal substring and
        ignores field filters like `tag:`. That accounts for most "search finds
        nothing" reports.
      options:
        - 'Yes'
        - 'No'
        - "Don't know"
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you called, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: >-
        Tool result or stderr. Please redact tokens, private keys, internal hostnames
        and IPs — this issue is public. Bookmark titles and URLs are your data; redact
        those too if they are not part of the problem.
      render: text
