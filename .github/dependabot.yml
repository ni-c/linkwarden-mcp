version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Lockstep packages: bumped separately they arrive as individually broken PRs.
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      eslint:
        patterns:
          - eslint
          - '@eslint/*'
          - typescript-eslint
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Exists so the digest-pinned base image gets refreshed at all. Node majors are
  # excluded because Dependabot offers whatever tag is newest, while the runtime
  # image has to sit on an ACTIVE LTS line — and roughly half of all Node majors
  # never become LTS. Crossing an LTS boundary is a decision, not an update.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major

  # The documentation site has its own manifest and lockfile on purpose: VitePress
  # must never end up in the root install, which runs in the Docker build and in the
  # whole test matrix. Excluded from auto-merge — docs.yml is path filtered and so
  # cannot be a required check.
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init and analyze are separate dependencies to Dependabot. Ungrouped, a
      # v4/v5 mismatch between the two lands as two PRs and kills the codeql job.
      codeql:
        patterns:
          - github/codeql-action*
